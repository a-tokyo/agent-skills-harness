name: checks

# Two deterministic jobs. No secrets, no API keys, no network beyond checkout.
#
# `self-test` is the one that matters to a fork, and it runs everywhere — including on pull requests
# from forks, which is the point: the people most likely to break something here are the people who
# just forked it. `parity` is publisher-specific and is skipped outside this repo (see its `if:`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The gate runs the structural checks and fails on any failure not on its written advisory
      # list. It compares the issues, not the check count — new checks raise the total, so comparing
      # counts would hide a regression behind a rising number.
      #
      # Deliberately no `npm install`: the gate needs only bash and python3, and asserting that here
      # keeps the "runs immediately on a fresh clone" promise in the README honest.
      - name: Run the gate
        run: bash self-test/evaluation/gate.sh

  parity:
    name: factory parity with the published copy
    runs-on: ubuntu-latest
    # Only meaningful in the repo that publishes to a-tokyo/agent-skills. A fork editing the factory —
    # the main reason to fork — would otherwise get a permanent red X for diverging from someone else's
    # registry, with no way to clear it. Point PARITY_TARGET at your own registry to re-enable it.
    if: github.repository == 'a-tokyo/agent-skills-harness'
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness

      - uses: actions/checkout@v7
        with:
          repository: a-tokyo/agent-skills
          path: published
          fetch-depth: 1

      - name: Diff the factory against its published copy
        run: bash harness/.github/scripts/check-parity.sh harness published
