name: checks

# Deterministic jobs. No secrets, no API keys, no network beyond checkout and the runner's Python.
#
# `self-test` is the one that matters to a fork, and it runs everywhere — including on pull requests
# from forks, which is the point: the people most likely to break something here are the people who
# just forked it. `parity` is publisher-specific and is skipped outside this repo (see its `if:`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The gate runs the structural checks and fails on any failure not on its written advisory
      # list. It compares the issues, not the check count — new checks raise the total, so comparing
      # counts would hide a regression behind a rising number.
      #
      # Deliberately no `npm install`: the gate needs only bash and python3, and asserting that here
      # keeps the "runs immediately on a fresh clone" promise in the README honest.
      - name: Run the gate
        run: bash self-test/evaluation/gate.sh

  # The factory's scripts and kill guard run on every host OS a builder may use; the gate above covers
  # Linux. Windows runs the same tests natively (Job Objects, msvcrt locks, Git Bash for run-case.sh),
  # on a Python that does not default to UTF-8, so a missing encoding shows up here.
  script-tests:
    name: factory script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the factory's script tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s .agents/skills/create-skill-autoresearch/scripts/tests -v

  # One manual-protocol gate end to end on native Windows, with a stub executor: record, the detached
  # gate and its wait, check_gate.py, --panel and --finish. No claude and no network.
  gate-smoke:
    name: manual gate smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run one manual gate with a stub run-case.sh
        shell: bash
        env:
          PYTHON: python
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash .github/scripts/gate-smoke.sh

  parity:
    name: factory parity with the published copy
    runs-on: ubuntu-latest
    # Only meaningful in the repo that publishes to a-tokyo/agent-skills. A fork editing the factory —
    # the main reason to fork — would otherwise get a permanent red X for diverging from someone else's
    # registry, with no way to clear it. Point PARITY_TARGET at your own registry to re-enable it.
    if: github.repository == 'a-tokyo/agent-skills-harness'
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness

      - uses: actions/checkout@v7
        with:
          repository: a-tokyo/agent-skills
          path: published
          fetch-depth: 1

      - name: Diff the factory against its published copy
        run: bash harness/.github/scripts/check-parity.sh harness published
